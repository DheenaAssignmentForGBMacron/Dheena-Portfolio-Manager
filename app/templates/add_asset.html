{% extends "base.html" %}

{% block content %}

<h1>Add Asset</h1>

<form method="POST" class="form-card">

    <label for="symbol">
        Symbol
    </label>

    <input
        id="symbol"
        type="text"
        name="symbol"
        required
    >

    <label for="name">
        Name
    </label>

    <input
        id="name"
        type="text"
        name="name"
        required
    >

    <label for="asset_class">
        Asset Type
    </label>

    <select
        id="asset_class"
        name="asset_class"
        required
    >
        <option value="Stock">Stock</option>
        <option value="ETF">ETF</option>
        <option value="Mutual Fund">Mutual Fund</option>
        <option value="Crypto">Crypto</option>
        <option value="Commodity">Commodity</option>
    </select>

    <label for="exchange">
        Exchange
    </label>

    <select
        id="exchange"
        name="exchange"
        required
    >
        <option value="NSE">NSE</option>
        <option value="BSE">BSE</option>
        <option value="NASDAQ">NASDAQ</option>
        <option value="NYSE">NYSE</option>
        <option value="BINANCE">BINANCE</option>
    </select>

    <button
        type="submit"
        class="primary-btn"
    >
        Save Asset
    </button>

</form>

{% endblock %}
