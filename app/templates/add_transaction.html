{% extends "base.html" %}

{% block content %}

<h1>Add Transaction</h1>

{% if error_message %}

<div
    id="errorModal"
    class="modal"
    role="dialog"
>

    <div class="modal-content">

        <h3>Transaction Failed</h3>

        <p>{{ error_message }}</p>

        <button
            type="button"
            class="primary-btn"
            onclick="closeModal()"
        >
            OK
        </button>

    </div>

</div>

{% endif %}

<div class="transaction-form-card">

    <form method="POST">

        <label>Asset</label>

        <div class="autocomplete">

            <input
                type="text"
                id="asset-search"
                name="asset"
                autocomplete="off"
                placeholder="Search asset..."
                required
            >

            <input
                type="hidden"
                id="asset-id"
                name="asset_id"
            >

            <div
                id="asset-results"
                class="autocomplete-results"
            ></div>

        </div>

        <label>Asset Type</label>

        <select name="asset_type">

            <option>Stock</option>
            <option>Mutual Fund</option>
            <option>ETF</option>

        </select>

        <label>Transaction</label>

        <select name="transaction_type">

            <option>BUY</option>
            <option>SELL</option>

        </select>

        <label>Quantity</label>

        <input
            type="number"
            name="quantity"
            min="1"
            step="1"
            required
        >

        <label>Price</label>

        <input
            type="number"
            name="price"
            min="0"
            step="0.01"
            placeholder="e.g. 499.99"
            required
        >

        <label>Brokerage</label>

        <input
            type="number"
            name="brokerage"
            min="0"
            step="0.01"
            value="0"
        >

        <label>Date</label>

        <input
            type="date"
            name="transaction_date"
            value="{{ today }}"
            required
        >

        <label>Notes</label>

        <textarea
            name="notes"
            rows="4"
            placeholder="Optional notes..."
        ></textarea>

        <button
            type="submit"
            class="primary-btn"
        >
            Save Transaction
        </button>

    </form>

</div>

{% endblock %}
